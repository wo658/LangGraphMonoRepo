service: nest-api
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  profile: langvis-prd
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 20
  httpApi:
    cors:
      allowedOrigins:
        - https://langvis.com
        - https://www.langvis.com
        - http://localhost:3000
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowedHeaders:
        - Content-Type
        - Authorization
      allowCredentials: true
  environment:
    NODE_OPTIONS: --enable-source-maps
    AUTH_CALLBACK_BASE: https://api.langvis.com
    FRONTEND_URL: https://langvis.com
    FRONTEND_URLS: https://langvis.com,https://www.langvis.com
    JWT_SECRET: ASDOsdsadkoo23219302asASDKO2042315wsadf4512w4e
    MONGO_URI: mongodb+srv://whdgns2347:YswNeRgrJ1neWdGL@langgraphproject.etir86a.mongodb.net/?retryWrites=true&w=majority&appName=LangGraphProject
    OPENROUTER_API_KEY: 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
    GOOGLE_CLIENT_ID: 196680110212-g1pf5po22og2p3kk9jc8imtefqaddb92.apps.googleusercontent.com
    GOOGLE_CLIENT_SECRET: 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
    GITHUB_CLIENT_ID: Ov23liGjvJw5F5UxrJ9q
    GITHUB_CLIENT_SECRET: ca6aa1da00717dec53204e0376ea69a68fc49919

plugins:
  - serverless-esbuild
  - serverless-domain-manager

custom:
  esbuild:
    bundle: true
    minify: true
    target: node20
    platform: node
    sourcemap: false
    external:
      # Exclude optional NestJS packages that are conditionally required by @nestjs/core
      - '@nestjs/microservices'
      - '@nestjs/microservices/microservices-module'
      - '@nestjs/websockets'
      - '@nestjs/websockets/socket-module'
      # Exclude deep import that may not be exported by class-transformer
      - 'class-transformer/storage'
  customDomain:
    domainName: api.langvis.com
    basePath: ''
    stage: prd
    createRoute53Record: false
    certificateName: 'api.langvis.com'
    endpointType: regional
    apiType: http



functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi:
          method: '*'
          path: '/{proxy+}'
      - httpApi:
          method: 'GET'
          path: '/'
